name: ci

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Сборка клиента
        run: npm run build

      - name: Сервер + сценарный тест (36 проверок)
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/8787) 2>/dev/null && break
            sleep 0.5
          done
          node scripts/selftest.js
          kill $SERVER_PID

  # Деплой не обязателен: VPS сам подтягивает main таймером раз в минуту.
  # Если заданы секреты VPS_HOST / VPS_SSH_KEY — обновление дёргается сразу же.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Мгновенный деплой по ssh (ключ или пароль)
        if: env.VPS_HOST != '' && (env.VPS_SSH_KEY != '' || env.VPS_PASSWORD != '')
        run: |
          U="${VPS_USER:-root}"
          CMD='systemctl start smena-update.service; systemctl --no-pager -l status smena | head -5'
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$U@$VPS_HOST" "$CMD"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "$U@$VPS_HOST" "$CMD"
          fi

      - name: Секретов нет — деплой таймером
        if: env.VPS_HOST == '' || (env.VPS_SSH_KEY == '' && env.VPS_PASSWORD == '')
        run: echo "Секреты VPS не заданы. Сервер подтянет этот коммит сам в течение минуты (smena-update.timer)."
