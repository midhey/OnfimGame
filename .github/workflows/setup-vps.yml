name: setup-vps

# Первичная установка «Смены» на VPS кнопкой из браузера:
# Actions -> setup-vps -> Run workflow. SSH с рабочего компа не нужен —
# на сервер ходит раннер GitHub. Нужны секреты:
#   VPS_HOST                — IP или домен сервера
#   VPS_SSH_KEY или VPS_PASSWORD — приватный ключ ИЛИ root-пароль от провайдера
#   VPS_USER                — опционально, по умолчанию root
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Домен для HTTPS (пусто — http по IP)'
        required: false
        default: ''
      host_pass:
        description: 'Пароль ведущего (пусто — сгенерируется и попадёт в сводку)'
        required: false
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      DOMAIN: ${{ inputs.domain }}
      HOST_PASS: ${{ inputs.host_pass }}
    steps:
      - name: Проверка секретов
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::Добавьте секрет VPS_HOST (Settings -> Secrets -> Actions)"; exit 1; }
          [ -n "$VPS_SSH_KEY$VPS_PASSWORD" ] || { echo "::error::Добавьте VPS_SSH_KEY или VPS_PASSWORD"; exit 1; }

      - name: Установка на VPS
        run: |
          U="${VPS_USER:-root}"
          CMD="curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/vps-setup.sh \
            | REPO=https://github.com/${{ github.repository }} BRANCH='${{ github.ref_name }}' DOMAIN='$DOMAIN' SMENA_HOST_PASS='$HOST_PASS' bash"
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$U@$VPS_HOST" "$CMD" | tee setup.log
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "$U@$VPS_HOST" "$CMD" | tee setup.log
          fi

      - name: Итог в сводку запуска
        if: always()
        run: |
          {
            echo "## Смена на VPS"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' setup.log 2>/dev/null | tail -14 || echo "лог пуст — смотрите шаг выше"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
